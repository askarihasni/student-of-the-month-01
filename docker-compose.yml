version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vectorly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vectorly_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vectorly_db']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vectorly_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/vectorly_db?schema=public
      JWT_ACCESS_SECRET: vectorly_super_secure_jwt_access_secret_key_2026_prod
      JWT_REFRESH_SECRET: vectorly_super_secure_jwt_refresh_secret_key_2026_prod
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
      COOKIE_SECRET: vectorly_cookie_secret_key_99999
    ports:
      - '5000:5000'
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:
